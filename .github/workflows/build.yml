name: Build APK from zip
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project
        run: |
          unzip -q AuroraLauncher.zip -d _src
          echo "PROJECT_DIR=$(dirname "$(find _src -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # Automatically accept Android SDK licenses if prompted by Gradle
          yes | sdkmanager --licenses || true
          gradle assembleDebug --stacktrace
          
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraLauncher-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
