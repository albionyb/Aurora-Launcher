# Phone-friendly variant: keep AuroraLauncher.zip in the repo root and build straight from it.
# Save this file in your repo as .github/workflows/build.yml
# Every successful build also publishes a GitHub Release with the APK attached.
name: Build APK from zip
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q AuroraLauncher.zip -d _src
          echo "PROJECT_DIR=$(dirname "$(find _src -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp "$(ls ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk | head -1)" AuroraLauncher-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraLauncher-debug-apk
          path: AuroraLauncher-debug.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aurora Launcher build ${{ github.run_number }}
          body: Automatic debug build from commit ${{ github.sha }}.
          files: AuroraLauncher-debug.apk
          make_latest: true
